# Scripted applications for the demo tracker (demo_seed.py). All invented.
#
# Each entry gets its own posting, built from demo_data/jobs.yaml and scored
# by the real pipeline, then a lane history replayed as events.
#
#   steps        [when, lane] in order; the first is the day the job was tracked.
#                when is a count of workdays before the anchor day (0 = the
#                anchor itself), or "sunday" for the last Sunday before it.
#                A trailing third item gives the earliest slot of the day the
#                step exists in (1 = after the morning sweep, 2 = after the
#                afternoon one), used only for steps on the anchor day.
#   seen_before  calendar days between the posting's first_seen and tracking.
#   due          next_action_due, in days from the anchor.

excused_workday: 9          # this many workdays back is an excused day
excused_reason: Traveling for a family event

