# Labeled synthetic mail for the demo (demo_seed.py) and, later, the evals.
# Every message is invented: written from the kinds of mail an applicant
# gets, never copied from a real inbox. Addresses use the reserved .example
# domain.
#
#   app      the application (demo_data/tracker.yaml key) the mail is about;
#            {company} and {title} in the text come from it.
#   when     {after: <lane>, minutes: N}   N minutes after that lane step
#            {before: <lane>, minutes: N}  N minutes before that lane step
#            {workdays: N, at: "HH:MM"}    N workdays before the anchor day
#   expect   the human label: what the mail is (rejected, interviewing,
#            offer, receipt, person, reply, noise, or drop for mail that
#            should leave no trace) and, where it matters, which application
#            it belongs to.
#   seed     what the user did with the suggestion in the demo's history:
#            accepted, pending or dismissed. Receipts file themselves.
#   known_miss  true where the rule-based classifier is expected to disagree
#            with the label. Kept on purpose: the evals measure these.

messages:
  # --- receipts: automated, forward-looking, nothing else in them ---
  - id: m01
    app: offer
    when: {after: applied, minutes: 3}
    from_name: Lumenfield Careers
    from_addr: no-reply@lumenfield.example
    subject: Thanks for applying to Lumenfield
    body: |
      Hi {first},

      Thanks for applying for the {title} role at {company}. We've received your application, and our team will review it over the next week.

      If your background looks like a match, a recruiter will reach out to set up a first conversation.

      The {company} Talent Team
    expect: {kind: receipt, app: offer}
  - id: m02
    app: int_acme
    when: {after: applied, minutes: 2}
    from_name: Acme Corp Recruiting
    from_addr: recruiting@acme.example
    subject: "Your application to {company}"
    body: |
      Hello {first},

      Your application for {title} was received. We are reviewing applications in the order they arrive and will be in touch if there is a fit.

      Thank you for your interest in {company}.
    expect: {kind: receipt, app: int_acme}
  - id: m03
