<div id="board"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% for lane in lanes %}
  <section class="lane">
    <h2>{{ lane.name }} <span class="count">{{ lane.apps | length }}</span></h2>
    {% for a in lane.apps %}
      {% include "_app_card.html" %}
    {% else %}
      <p class="lane-empty">&mdash;</p>
    {% endfor %}
  </section>
  {% endfor %}
</div>
